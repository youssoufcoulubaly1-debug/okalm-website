<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page introuvable | OKALM</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/assets/favicon.ico" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    body { font-family: 'Inter', var(--font); }
    .error-page { min-height: 80vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 40px 20px; }
    .error-code { font-size: 6rem; font-weight: 900; color: var(--primary); line-height: 1; margin-bottom: 16px; }
  </style>
</head>
<body>

<nav class="nav">
  <div class="nav__inner">
    <a href="/" class="nav__logo">OKALM</a>
    <button class="nav__toggle" aria-label="Menu">☰</button>
    <div class="nav__links">
      <a href="/" class="btn btn--outline btn--sm">Retour à l'accueil</a>
    </div>
  </div>
</nav>

<div class="error-page">
  <div>
    <div class="error-code">404</div>
    <h1 style="font-size:1.8rem;margin-bottom:12px">Page introuvable</h1>
    <p class="text-muted mb-4">La page que vous cherchez n'existe pas ou a été déplacée.</p>
    <div class="hero__cta" style="justify-content:center">
      <a href="/" class="btn btn--primary">Retour à l'accueil</a>
      <a href="/support" class="btn btn--outline">Contacter le support</a>
    </div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
